<!doctype html>
<html lang="en">
<meta charset="utf-8">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../css/ckeditor.css">
<title>Shared CKEditor build smoke test</title>
<h1>Shared CKEditor build smoke test</h1>
<p>This standalone test checks plugin activation and Base64 conversion, not the CiviCRM connector.</p>
<h2>Base64</h2><div id="base64"><p>Base64 mode</p></div>
<h2>elFinder plugin configuration</h2><div id="elfinder"><p>elFinder mode</p></div>
<h2>Opt-in bundled plugins</h2><div id="opt-in"><p>Optional plugins</p></div>
<h2>Markdown</h2><div id="markdown" data-preset="markdown">## Markdown mode</div>
<pre id="result">Running</pre>
<script src="../js/ckeditor5/ckeditor-classic-build/build/ckeditor.js"></script>
<script>
// Only the configuration helper is exercised; this is not a CiviCRM runtime.
const $ = item => ({attr: name => item.getAttribute(name), trigger() {}});
$.extend = Object.assign;
$.isPlainObject = value => value !== null && typeof value === 'object'
  && Object.getPrototypeOf(value) === Object.prototype;
window.CRM = {$, _: {}, wysiwyg: {}, config: {
  locale: 'en_US',
  CKEditor5EmojiDefinitions: '../js/ckeditor5/emoji/16/en.json'
},
ts: () => value => value,
url: path => path,
crmMailing: {
  mailTokens: [{
    text: 'Contact',
    children: [
      {id: '{contact.display_name}', text: 'Display name'},
      {id: '{contact.email}', text: 'Email'}
    ]
  }]
}};
</script>
<script src="../js/wysiwyg/crm.ckeditor5.js"></script>
<script src="../js/plugins/civi-tokens.js"></script>
<script>
(async function () {
  const check = (condition, message) => { if (!condition) throw new Error(message); };
  check(window.CKEDITOR_VERSION === '49.0.1', 'Unexpected CKEditor runtime version');
  check(window.CKEDITOR && window.CKEDITOR.Plugin, 'Shared CKEditor runtime API is missing');
  check(typeof window.CKEDITOR.FullPage === 'function', 'FullPage is not exposed by the shared runtime');
  check(typeof window.CKEDITOR.ImageInsert === 'function', 'ImageInsert is not exposed by the shared runtime');
  class ExternalSmokePlugin extends window.CKEDITOR.Plugin {
    static get pluginName() {
      return 'ExternalSmokePlugin';
    }
  }
  CRM.ckeditor5.registerPlugin('ExternalSmokePlugin', ExternalSmokePlugin, {
    ckeditorVersion: window.CKEDITOR.version
  });
  const base64Element = document.querySelector('#base64');
  const base64 = await ClassicEditor.create({
    ...CRM.wysiwyg.getConfig(base64Element, false), attachTo: base64Element
  });
  for (const pluginName of [
    'AutoLink', 'Bookmark', 'Emoji', 'IndentBlock', 'Mention', 'ShowBlocks',
    'TableCaption', 'TextPartLanguage', 'TodoList', 'WordCount'
  ]) {
    check(base64.plugins.has(pluginName), 'Bundled plugin missing: ' + pluginName);
  }
  check(!base64.plugins.has('FullPage'), 'FullPage must remain opt-in');
  check(!base64.plugins.has('ImageInsert'), 'ImageInsert must remain opt-in');
  check(base64.plugins.has('Base64UploadAdapter'), 'Base64 adapter missing');
  check(base64.plugins.has('CiviFileManager'), 'CiviCRM file manager plugin missing');
  check(base64.plugins.has('CiviTokens'), 'CiviCRM token plugin missing');
  const civiMentionFeed = base64.config.get('mention.feeds').find(feed => feed.marker === '{');
  check(civiMentionFeed, 'CiviCRM native mention feed missing');
  const tokenMatches = await civiMentionFeed.feed.call(base64, 'contact.d');
  check(tokenMatches.length === 1 && tokenMatches[0].id === '{contact.display_name}', 'CiviCRM token feed failed');
  base64.setData('<p>{con</p>');
  let completionRange;
  base64.model.change(writer => {
    const paragraph = base64.model.document.getRoot().getChild(0);
    const focus = base64.model.createPositionAt(paragraph, 'end');
    completionRange = writer.createRange(focus.getShiftedBy(-4), focus);
    writer.setSelection(focus);
  });
  base64.execute('mention', {
    marker: '{',
    mention: tokenMatches[0],
    text: tokenMatches[0].id,
    range: completionRange
  });
  check(base64.getData() === '<p>{contact.display_name}</p>', 'CiviCRM token mention was not saved as plain text');
  check(!base64.config.get('toolbar.items').includes('civiFileManager'), 'File manager button must be disabled');
  const repository = base64.plugins.get('FileRepository');
  repository.createUploadAdapter = CRM.ckeditor5.createValidatedBase64UploadAdapter;
  const imageBlob = await new Promise(resolve => {
    const canvas = document.createElement('canvas');
    canvas.width = 1;
    canvas.height = 1;
    canvas.getContext('2d').fillRect(0, 0, 1, 1);
    canvas.toBlob(resolve, 'image/png');
  });
  const file = new File([imageBlob], 'test.png', {type: 'image/png'});
  const loader = repository.createLoader(file);
  const result = await loader.upload();
  check(result.default.startsWith('data:image/png;base64,'), 'Base64 conversion failed');
  repository.destroyLoader(loader);
  const invalidLoader = repository.createLoader(new File(['not an image'], 'invalid.png', {type: 'image/png'}));
  try {
    await invalidLoader.upload();
    throw new Error('Invalid Base64 image was accepted');
  }
  catch (error) {
    check(error.message.includes('could not be decoded'), 'Invalid image failed for an unexpected reason');
  }
  repository.destroyLoader(invalidLoader);
  const oversizedLoader = repository.createLoader(new File(
    [new Uint8Array(CRM.ckeditor5.base64MaximumFileSize + 1)],
    'oversized.png',
    {type: 'image/png'}
  ));
  try {
    await oversizedLoader.upload();
    throw new Error('Oversized Base64 image was accepted');
  }
  catch (error) {
    check(error.message.includes('10 MiB'), 'Oversized image failed for an unexpected reason');
  }
  repository.destroyLoader(oversizedLoader);
  const elfinderElement = document.querySelector('#elfinder');
  const elfinder = await ClassicEditor.create({
    ...CRM.wysiwyg.getConfig(elfinderElement, true), attachTo: elfinderElement
  });
  check(!elfinder.plugins.has('Base64UploadAdapter'), 'Base64 must be disabled');
  check(elfinder.plugins.has('CiviFileManager'), 'File manager integration missing');
  check(elfinder.config.get('toolbar.items').includes('civiFileManager'), 'File manager button missing');
  const optInElement = document.querySelector('#opt-in');
  const optInConfig = CRM.wysiwyg.getConfig(optInElement, false);
  optInConfig.civiPreserveTemplateStyles = false;
  CRM.ckeditor5.enableBundledPlugin(optInConfig, 'FullPage');
  CRM.ckeditor5.enableBundledPlugin(optInConfig, 'ImageInsert');
  optInConfig.toolbar.items = ['insertImage'];
  const optIn = await ClassicEditor.create({...optInConfig, attachTo: optInElement});
  check(optIn.plugins.has('FullPage'), 'FullPage opt-in failed');
  check(optIn.plugins.has('ImageInsert'), 'ImageInsert opt-in failed');
  check(optIn.ui.componentFactory.has('insertImage'), 'ImageInsert toolbar component missing');
  const markdownElement = document.querySelector('#markdown');
  const markdown = await ClassicEditor.create({
    ...CRM.wysiwyg.getConfig(markdownElement, false), attachTo: markdownElement
  });
  check(markdown.plugins.has('Markdown'), 'Markdown data processor missing');
  check(markdown.plugins.has('PasteFromMarkdownExperimental'), 'Markdown paste plugin missing');
  check(!markdown.plugins.has('ImageUpload'), 'Markdown preset must not load image uploads');
  markdown.setData('## Heading\n\nThis is **bold** and [linked](https://civicrm.org).');
  check(
    markdown.getData() === '## Heading\n\nThis is **bold** and [linked](https://civicrm.org).',
    'Markdown data was not preserved'
  );
  // Presentation preservation uses email-compatible tables without a figure.
  const source = '<h2>Title</h2><p><strong>Bold</strong> <span style="color:#0000ff;">Blue</span></p><table><tbody><tr><td style="background-color:#ff0000;">Cell</td></tr></tbody></table>';
  const expected = source.replace('<table>', '<table class="table content-table">');
  for (const editor of [base64, elfinder]) {
    check(editor.plugins.has('ExternalSmokePlugin'), 'Registered external plugin missing');
    editor.setData(source);
    check(editor.getData() === expected, 'Unexpected plain-table output');
    for (const Plugin of ClassicEditor.builtinPlugins) {
      if (!editor.config.get('removePlugins').includes(Plugin.pluginName)) {
        check(editor.plugins.has(Plugin), 'Missing plugin: ' + Plugin.pluginName);
      }
    }
    for (const item of editor.config.get('toolbar.items').filter(item => item !== '|')) {
      check(editor.ui.componentFactory.has(item), 'Missing toolbar component: ' + item);
    }
    check(getComputedStyle(editor.ui.view.toolbar.element).display === 'flex', 'Toolbar CSS did not load');
  }
  window.sharedBuildEditors = {base64, elfinder, optIn, markdown};
  window.sharedBuildTest = {passed: true, version: window.CKEDITOR_VERSION, html: base64.getData()};
  document.querySelector('#result').textContent = 'PASS: HTML and Markdown modes initialize; Base64 validation succeeds.';
})().catch(error => {
  window.sharedBuildTest = {passed: false, error: error.message};
  document.querySelector('#result').textContent = 'FAIL: ' + error.message;
});
</script>
</html>
